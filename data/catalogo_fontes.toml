# Vacinas do adulto e da gestante: dTpa, VSR e hepatite B (2-8); influenza,
# covid-19 e febre amarela (25-35); tríplice viral (37-39); dengue, dT e
# informações gerais (50-60). Seções infantis (BCG, VIP, rotavírus etc.) ficam de fora.
paginas = [[2, 8], [25, 35], [37, 39], [50, 60]]
# Texto entre o nome da vacina e o primeiro subtítulo.
secao_padrao = "esquema_vacinal"

# Entidade de cada vacina, pelo título "N. Vacina ..." (vale a primeira regra).
[[fontes.regras_entidade]]
padrao = "\\bdTpa\\b"
entidade = "dtpa"

[[fontes.regras_entidade]]
padrao = "sincicial|VVSR"
entidade = "vsr"

[[fontes.regras_entidade]]
padrao = "hepatite B"
entidade = "hepatite_b"

[[fontes.regras_entidade]]
padrao = "influenza"
entidade = "influenza"

[[fontes.regras_entidade]]
padrao = "covid"
entidade = "covid_19"

[[fontes.regras_entidade]]
padrao = "febre amarela"
entidade = "febre_amarela"

[[fontes.regras_entidade]]
padrao = "sarampo|tr[íi]plice viral"
entidade = "triplice_viral"

[[fontes.regras_entidade]]
padrao = "dengue"
entidade = "dengue"

[[fontes.regras_entidade]]
padrao = "dupla adulto"
entidade = "dupla_adulto_dt"

