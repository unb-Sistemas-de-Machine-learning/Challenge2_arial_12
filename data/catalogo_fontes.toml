# Catálogo das fontes oficiais do corpus do EvidencIA Saúde (issue #11).
#
# Cada entrada descreve um PDF de data/raw/. O pipeline de ingestão confere o
# sha256, processa apenas as páginas listadas em `paginas` e anexa a cada chunk
# os metadados abaixo (Seção 2 de docs/arquitetura/contrato-json-e-metadados-rag.md).
# Os `doc_id` são os mesmos de `documentos_referencia` no golden dataset.
# A ficha descritiva do corpus está em docs/data_card.md.

versao_corpus = "corpus-v1.0.0"

